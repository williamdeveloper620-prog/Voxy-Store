<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - متجر Voxy</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .login-card {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 320px;
            text-align: center;
        }
        h2 { color: #00adb5; margin-bottom: 20px; }
        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #333;
            border-radius: 5px;
            background-color: #2a2a2a;
            color: #fff;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #00adb5;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }
        button:hover { background-color: #007e85; }
        .toggle-btn {
            background: none;
            border: none;
            color: #00adb5;
            cursor: pointer;
            margin-top: 15px;
            font-size: 13px;
        }
        .admin-proof-group {
            margin-top: 5px;
            text-align: right;
        }
        .admin-proof-group label {
            font-size: 12px;
            color: #aaa;
        }
    </style>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

    <div class="login-card">
        <h2 id="form-title">تسجيل الدخول</h2>
        <input type="text" id="username" placeholder="اسم المستخدم" required>
        <input type="password" id="password" placeholder="كلمة المرور" required>
        
        <div class="admin-proof-group">
            <label>إثبات أدمين (اتركه فارغاً للمستخدم العادي):</label>
            <input type="text" id="admin-proof" placeholder="رمز إثبات الأدمين">
        </div>

        <button id="submit-btn" onclick="handleSubmit()">دخول</button>
        <button class="toggle-btn" onclick="toggleMode()" id="toggle-text">ليس لديك حساب؟ إنشاء حساب جديد</button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAIU9w0_A9ba4agXyFIqAFZ_YpWV06sQGo",
            authDomain: "voxy-store.firebaseapp.com",
            projectId: "voxy-store",
            storageBucket: "voxy-store.firebasestorage.app",
            messagingSenderId: "21920174610",
            appId: "1:21920174610:web:29eeff5eda3aa5e4d6becb"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let isSignUp = false;

        const SUPER_ADMIN_KEY = "AdminSuperAdminX123@#$&+";
        const ADMIN_REQUEST_KEY = "Admin123Admin+/+. /";

        function toggleMode() {
            isSignUp = !isSignUp;
            document.getElementById('form-title').textContent = isSignUp ? "حساب جديد" : "تسجيل الدخول";
            document.getElementById('submit-btn').textContent = isSignUp ? "إنشاء حساب" : "دخول";
            document.getElementById('toggle-text').textContent = isSignUp ? "لديك حساب بالفعل؟ تسجيل الدخول" : "ليس لديك حساب؟ إنشاء حساب جديد";
        }

        async function handleSubmit() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const adminProof = document.getElementById('admin-proof').value.trim();

            if (!username || !password) {
                alert("يرجى إدخال اسم المستخدم وكلمة المرور!");
                return;
            }

            const userRef = db.collection('users').doc(username);
            const userDoc = await userRef.get();

            if (isSignUp) {
                if (userDoc.exists) {
                    alert("اسم المستخدم هذا مأخوذ بالفعل!");
                    return;
                }

                let assignedRole = 'user';
                let adminStatus = 'approved';

                if (adminProof === SUPER_ADMIN_KEY) {
                    assignedRole = 'super_admin';
                } else if (adminProof === ADMIN_REQUEST_KEY) {
                    assignedRole = 'admin';
                    adminStatus = 'pending'; // ينتظر موافقة السوبر أدمين
                } else if (adminProof !== "") {
                    alert("رمز إثبات الأدمين غير صحيح!");
                    return;
                }

                await userRef.set({
                    username: username,
                    password: password,
                    role: assignedRole,
                    adminStatus: adminStatus
                });

                localStorage.setItem('voxy_username', username);
                localStorage.setItem('voxy_role', assignedRole);

                if (assignedRole === 'super_admin') {
                    alert("تم إنشاء حسابك كـ سوبر أدمين بنجاح!");
                    window.location.href = "admin.html";
                } else if (assignedRole === 'admin' && adminStatus === 'pending') {
                    alert("تم إرسال طلب ترقية الأدمين للسوبر أدمين للمراجعة. يمكنك تصفح المتجر كمستخدم لحين الموافقة!");
                    window.location.href = "store.html";
                } else {
                    alert("تم إنشاء الحساب بنجاح!");
                    window.location.href = "store.html";
                }

            } else {
                if (!userDoc.exists || userDoc.data().password !== password) {
                    alert("اسم المستخدم أو كلمة المرور غير صحيحة!");
                    return;
                }

                let userData = userDoc.data();
                let currentRole = userData.role || 'user';
                let currentStatus = userData.adminStatus || 'approved';

                // إذا أرفق رمز السوبر أدمين أثناء الدخول يتم ترقيته مباشرة لسوبر أدمين
                if (adminProof === SUPER_ADMIN_KEY) {
                    currentRole = 'super_admin';
                    currentStatus = 'approved';
                    await userRef.update({ role: 'super_admin', adminStatus: 'approved' });
                } else if (adminProof === ADMIN_REQUEST_KEY && currentRole !== 'super_admin' && currentRole !== 'admin') {
                    currentRole = 'admin';
                    currentStatus = 'pending';
                    await userRef.update({ role: 'admin', adminStatus: 'pending' });
                    alert("تم تقديم طلب الأدمين للانتظار لموافقة السوبر أدمين!");
                } else if (adminProof !== "" && adminProof !== SUPER_ADMIN_KEY && adminProof !== ADMIN_REQUEST_KEY) {
                    alert("رمز إثبات الأدمين غير صحيح!");
                    return;
                }

                localStorage.setItem('voxy_username', username);
                localStorage.setItem('voxy_role', currentRole);

                if (currentRole === 'super_admin' || (currentRole === 'admin' && currentStatus === 'approved')) {
                    window.location.href = "admin.html";
                } else {
                    window.location.href = "store.html";
                }
            }
        }
    </script>
</body>
</html>
