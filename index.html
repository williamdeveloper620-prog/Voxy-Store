<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - متجر Voxy</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 320px;
            text-align: center;
        }
        h2 { color: #00adb5; margin-bottom: 20px; }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #333;
            border-radius: 5px;
            background-color: #2a2a2a;
            color: #fff;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #00adb5;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }
        button:hover { background-color: #007e85; }
        .toggle-btn {
            background: none;
            border: none;
            color: #00adb5;
            cursor: pointer;
            margin-top: 15px;
            font-size: 13px;
        }
    </style>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

    <div class="login-card">
        <h2 id="form-title">تسجيل الدخول</h2>
        <input type="text" id="username" placeholder="اسم المستخدم" required>
        <input type="password" id="password" placeholder="كلمة المرور" required>
        <button id="submit-btn" onclick="handleSubmit()">دخول</button>
        <button class="toggle-btn" onclick="toggleMode()" id="toggle-text">ليس لديك حساب؟ إنشاء حساب جديد</button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAIU9w0_A9ba4agXyFIqAFZ_YpWV06sQGo",
            authDomain: "voxy-store.firebaseapp.com",
            projectId: "voxy-store",
            storageBucket: "voxy-store.firebasestorage.app",
            messagingSenderId: "21920174610",
            appId: "1:21920174610:web:29eeff5eda3aa5e4d6becb"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let isSignUp = false;

        function toggleMode() {
            isSignUp = !isSignUp;
            document.getElementById('form-title').textContent = isSignUp ? "حساب جديد" : "تسجيل الدخول";
            document.getElementById('submit-btn').textContent = isSignUp ? "إنشاء حساب" : "دخول";
            document.getElementById('toggle-text').textContent = isSignUp ? "لديك حساب بالفعل؟ تسجيل الدخول" : "ليس لديك حساب؟ إنشاء حساب جديد";
        }

        async function handleSubmit() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            if (!username || !password) {
                alert("يرجى ملء كافة الحقول!");
                return;
            }

            // حساب السوبر أدمين الثابت
            if (username === "superadmin" && password === "super123") {
                localStorage.setItem('voxy_username', 'superadmin');
                localStorage.setItem('voxy_role', 'super_admin');
                window.location.href = "admin.html";
                return;
            }

            const userRef = db.collection('users').doc(username);
            const userDoc = await userRef.get();

            if (isSignUp) {
                if (userDoc.exists) {
                    alert("اسم المستخدم هذا مأخوذ بالفعل!");
                    return;
                }
                await userRef.set({
                    username: username,
                    password: password,
                    role: 'user'
                });
                localStorage.setItem('voxy_username', username);
                localStorage.setItem('voxy_role', 'user');
                alert("تم إنشاء الحساب بنجاح!");
                window.location.href = "store.html";
            } else {
                if (!userDoc.exists || userDoc.data().password !== password) {
                    alert("اسم المستخدم أو كلمة المرور غير صحيحة!");
                    return;
                }
                const userData = userDoc.data();
                localStorage.setItem('voxy_username', username);
                localStorage.setItem('voxy_role', userData.role || 'user');
                
                if (userData.role === 'admin' || userData.role === 'super_admin') {
                    window.location.href = "admin.html";
                } else {
                    window.location.href = "store.html";
                }
            }
        }
    </script>
</body>
</html>
