<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم الأدمين - متجر Voxy</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 950px;
            background-color: #1e1e1e;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }
        h1, h2 { color: #00adb5; text-align: center; }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #333;
            padding-bottom: 15px;
        }
        .btn {
            padding: 8px 12px;
            background-color: #00adb5;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 13px;
            text-decoration: none;
            display: inline-block;
        }
        .btn:hover { background-color: #007e85; }
        .btn-danger { background-color: #ff6b6b; }
        .btn-danger:hover { background-color: #e05555; }
        .btn-success { background-color: #51cf66; color: #121212; font-weight: bold; }
        .btn-success:hover { background-color: #40c057; }
        .btn-test { background-color: #339af0; color: white; }
        .btn-test:hover { background-color: #1c7ed6; }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid #333;
        }
        th { color: #00adb5; }
        .game-thumb { width: 45px; height: 45px; border-radius: 8px; object-fit: cover; }
        .empty-text { text-align: center; color: #777; padding: 20px; }
        .actions-cell {
            display: flex;
            gap: 5px;
            justify-content: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="top-bar">
            <h2 id="admin-title">لوحة التحكم</h2>
            <div>
                <a href="store.html" class="btn">ذهاب للمتجر</a>
                <button class="btn btn-danger" onclick="logout()">تسجيل خروج</button>
            </div>
        </div>

        <!-- قسم مراجعة الألعاب -->
        <h3>🎮 الألعاب المقترحة قيد الانتظار</h3>
        <table>
            <thead>
                <tr>
                    <th>الأيقونة</th>
                    <th>اسم اللعبة</th>
                    <th>المُرسل</th>
                    <th>الإصدار</th>
                    <th>التحكم والإجراءات</th>
                </tr>
            </thead>
            <tbody id="pending-games-list">
                <!-- ستعبأ ديناميكياً -->
            </tbody>
        </table>
    </div>

    <!-- قسم إدارة المستخدمين (خاص بالسوبر أدمين) -->
    <div class="container" id="users-section" style="display: none;">
        <h3>👥 إدارة المستخدمين المسجلين</h3>
        <table>
            <thead>
                <tr>
                    <th>اسم المستخدم</th>
                    <th>الصلاحية</th>
                    <th>التحكم والإجراءات</th>
                </tr>
            </thead>
            <tbody id="users-list">
                <!-- ستعبأ ديناميكياً -->
            </tbody>
        </table>
    </div>

    <script>
        window.onload = function() {
            const username = localStorage.getItem('voxy_username');
            const role = localStorage.getItem('voxy_role');

            if (!username || (role !== 'super_admin' && role !== 'admin')) {
                window.location.href = 'index.html';
                return;
            }

            document.getElementById('admin-title').textContent = `مرحباً بك يا أدمين (${username})`;

            if (role === 'super_admin') {
                document.getElementById('users-section').style.display = 'block';
                loadUsers();
            }

            loadPendingGames();
        };

        function loadPendingGames() {
            const tbody = document.getElementById('pending-games-list');
            let pending = JSON.parse(localStorage.getItem('voxy_pending_games')) || [];

            if (pending.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="empty-text">لا توجد ألعاب جديدة تنتظر المراجعة حالياً.</td></tr>`;
                return;
            }

            tbody.innerHTML = '';
            pending.forEach((game, index) => {
                tbody.innerHTML += `
                    <tr>
                        <td><img src="${game.icon}" class="game-thumb"></td>
                        <td><strong>${game.name}</strong></td>
                        <td>${game.uploader}</td>
                        <td>${game.version}</td>
                        <td>
                            <div class="actions-cell">
                                <a href="${game.link}" target="_blank" class="btn btn-test">🔍 تجربة اللعبة</a>
                                <button class="btn btn-success" onclick="approveGame(${index})">✔ موافقة ونشر</button>
                                <button class="btn btn-danger" onclick="rejectGame(${index})">✖ رفض وحذف</button>
                            </div>
                        </td>
                    </tr>
                `;
            });
        }

        function approveGame(index) {
            let pending = JSON.parse(localStorage.getItem('voxy_pending_games')) || [];
            let approvedGames = JSON.parse(localStorage.getItem('voxy_games')) || [];

            const gameToApprove = pending.splice(index, 1)[0];
            approvedGames.push(gameToApprove);

            localStorage.setItem('voxy_pending_games', JSON.stringify(pending));
            localStorage.setItem('voxy_games', JSON.stringify(approvedGames));

            alert('تم نشر اللعبة في المتجر بنجاح!');
            loadPendingGames();
        }

        function rejectGame(index) {
            let pending = JSON.parse(localStorage.getItem('voxy_pending_games')) || [];
            pending.splice(index, 1);
            localStorage.setItem('voxy_pending_games', JSON.stringify(pending));
            loadPendingGames();
        }

        function loadUsers() {
            const tbody = document.getElementById('users-list');
            let users = JSON.parse(localStorage.getItem('voxy_users_list')) || [];
            let admins = JSON.parse(localStorage.getItem('voxy_admins')) || [];

            if (users.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" class="empty-text">لا يوجد مستخدمين مسجلين بعد.</td></tr>`;
                return;
            }

            tbody.innerHTML = '';
            users.forEach((user, index) => {
                const isAdmin = admins.includes(user);
                tbody.innerHTML += `
                    <tr>
                        <td>${user}</td>
                        <td>${isAdmin ? 'أدمين عادي' : 'مستخدم عادي'}</td>
                        <td>
                            ${isAdmin ? 
                                `<button class="btn btn-danger" onclick="demoteUser('${user}')">إلغاء الأدمين</button>` : 
                                `<button class="btn btn-success" onclick="makeAdmin('${user}')">ترقية لأدمين</button>`
                            }
                            <button class="btn btn-danger" onclick="deleteUser(${index})" style="margin-right: 5px;">حذف</button>
                        </td>
                    </tr>
                `;
            });
        }

        function makeAdmin(username) {
            let admins = JSON.parse(localStorage.getItem('voxy_admins')) || [];
            if (!admins.includes(username)) {
                admins.push(username);
                localStorage.setItem('voxy_admins', JSON.stringify(admins));
                loadUsers();
                alert(`تم ترقية المستخدم ${username} إلى أدمين عادي بنجاح!`);
            }
        }

        function demoteUser(username) {
            let admins = JSON.parse(localStorage.getItem('voxy_admins')) || [];
            admins = admins.filter(a => a !== username);
            localStorage.setItem('voxy_admins', JSON.stringify(admins));
            loadUsers();
        }

        function deleteUser(index) {
            let users = JSON.parse(localStorage.getItem('voxy_users_list')) || [];
            users.splice(index, 1);
            localStorage.setItem('voxy_users_list', JSON.stringify(users));
            loadUsers();
        }

        function logout() {
            localStorage.removeItem('voxy_username');
            localStorage.removeItem('voxy_role');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
