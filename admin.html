<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم الأدمين - متجر Voxy</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 950px;
            background-color: #1e1e1e;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }
        h2 { color: #00adb5; text-align: center; }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #333;
            padding-bottom: 15px;
        }
        .btn {
            padding: 8px 12px;
            background-color: #00adb5;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 13px;
            text-decoration: none;
            display: inline-block;
        }
        .btn:hover { background-color: #007e85; }
        .btn-danger { background-color: #ff6b6b; }
        .btn-danger:hover { background-color: #e05555; }
        .btn-success { background-color: #51cf66; color: #121212; font-weight: bold; }
        .btn-success:hover { background-color: #40c057; }
        .btn-test { background-color: #339af0; color: white; }
        .btn-test:hover { background-color: #1c7ed6; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; text-align: center; border-bottom: 1px solid #333; }
        th { color: #00adb5; }
        .game-thumb { width: 45px; height: 45px; border-radius: 8px; object-fit: cover; }
        .empty-text { text-align: center; color: #777; padding: 20px; }
        .actions-cell { display: flex; gap: 5px; justify-content: center; }
    </style>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

    <div class="container">
        <div class="top-bar">
            <h2 id="admin-title">لوحة التحكم</h2>
            <div>
                <a href="store.html" class="btn">ذهاب للمتجر</a>
                <button class="btn btn-danger" onclick="logout()">تسجيل خروج</button>
            </div>
        </div>

        <h3>🎮 الألعاب المقترحة قيد الانتظار</h3>
        <table>
            <thead>
                <tr>
                    <th>الأيقونة</th>
                    <th>اسم اللعبة</th>
                    <th>المُرسل</th>
                    <th>الإصدار</th>
                    <th>التحكم والإجراءات</th>
                </tr>
            </thead>
            <tbody id="pending-games-list">
                <tr><td colspan="5" class="empty-text">جاري تحميل طلبات الألعاب...</td></tr>
            </tbody>
        </table>
    </div>

    <div class="container" id="users-section" style="display: none;">
        <h3>👥 إدارة المستخدمين المسجلين</h3>
        <table>
            <thead>
                <tr>
                    <th>اسم المستخدم</th>
                    <th>الصلاحية</th>
                    <th>التحكم والإجراءات</th>
                </tr>
            </thead>
            <tbody id="users-list">
                <tr><td colspan="3" class="empty-text">جاري تحميل المستخدمين...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAIU9w0_A9ba4agXyFIqAFZ_YpWV06sQGo",
            authDomain: "voxy-store.firebaseapp.com",
            projectId: "voxy-store",
            storageBucket: "voxy-store.firebasestorage.app",
            messagingSenderId: "21920174610",
            appId: "1:21920174610:web:29eeff5eda3aa5e4d6becb"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        window.onload = function() {
            const username = localStorage.getItem('voxy_username');
            const role = localStorage.getItem('voxy_role');

            if (!username || (role !== 'super_admin' && role !== 'admin')) {
                window.location.href = 'index.html';
                return;
            }

            document.getElementById('admin-title').textContent = `مرحباً بك يا أدمين (${username})`;

            if (role === 'super_admin') {
                document.getElementById('users-section').style.display = 'block';
                loadUsers();
            }

            loadPendingGames();
        };

        function loadPendingGames() {
            const tbody = document.getElementById('pending-games-list');
            
            db.collection('pending_games').onSnapshot(snapshot => {
                if (snapshot.empty) {
                    tbody.innerHTML = `<tr><td colspan="5" class="empty-text">لا توجد ألعاب جديدة تنتظر المراجعة حالياً.</td></tr>`;
                    return;
                }

                tbody.innerHTML = '';
                snapshot.forEach(doc => {
                    const game = doc.data();
                    const docId = doc.id;
                    tbody.innerHTML += `
                        <tr>
                            <td><img src="${game.icon}" class="game-thumb"></td>
                            <td><strong>${game.name}</strong></td>
                            <td>${game.uploader}</td>
                            <td>${game.version}</td>
                            <td>
                                <div class="actions-cell">
                                    <a href="${game.link}" target="_blank" class="btn btn-test">🔍 تجربة اللعبة</a>
                                    <button class="btn btn-success" onclick="approveGame('${docId}')">✔ موافقة ونشر</button>
                                    <button class="btn btn-danger" onclick="rejectGame('${docId}')">✖ رفض وحذف</button>
                                </div>
                            </td>
                        </tr>
                    `;
                });
            });
        }

        async function approveGame(docId) {
            const docRef = db.collection('pending_games').doc(docId);
            const doc = await docRef.get();
            if (doc.exists) {
                const gameData = doc.data();
                await db.collection('approved_games').add(gameData);
                await docRef.delete();
                alert('تم نشر اللعبة في المتجر السحابي بنجاح!');
            }
        }

        async function rejectGame(docId) {
            await db.collection('pending_games').doc(docId).delete();
            alert('تم رفض وحذف الطلب.');
        }

        function loadUsers() {
            const tbody = document.getElementById('users-list');
            
            db.collection('users').onSnapshot(snapshot => {
                if (snapshot.empty) {
                    tbody.innerHTML = `<tr><td colspan="3" class="empty-text">لا يوجد مستخدمين مسجلين بعد.</td></tr>`;
                    return;
                }

                tbody.innerHTML = '';
                snapshot.forEach(doc => {
                    const user = doc.data();
                    const isAdmin = user.role === 'admin';
                    tbody.innerHTML += `
                        <tr>
                            <td>${user.username}</td>
                            <td>${isAdmin ? 'أدمين عادي' : 'مستخدم عادي'}</td>
                            <td>
                                ${isAdmin ? 
                                    `<button class="btn btn-danger" onclick="setUserRole('${user.username}', 'user')">إلغاء الأدمين</button>` : 
                                    `<button class="btn btn-success" onclick="setUserRole('${user.username}', 'admin')">ترقية لأدمين</button>`
                                }
                                <button class="btn btn-danger" onclick="deleteUser('${user.username}')" style="margin-right: 5px;">حذف</button>
                            </td>
                        </tr>
                    `;
                });
            });
        }

        async function setUserRole(username, role) {
            await db.collection('users').doc(username).update({ role: role });
            alert(`تم تغيير صلاحية ${username} إلى ${role}`);
        }

        async function deleteUser(username) {
            await db.collection('users').doc(username).delete();
            alert(`تم حذف المستخدم ${username}`);
        }

        function logout() {
            localStorage.removeItem('voxy_username');
            localStorage.removeItem('voxy_role');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
