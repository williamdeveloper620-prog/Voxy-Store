<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رفع لعبة جديدة - متجر Voxy</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .form-card {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 400px;
        }
        h2 { color: #00adb5; text-align: center; margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 14px; color: #ccc; }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #333;
            border-radius: 5px;
            background-color: #2a2a2a;
            color: #fff;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #00adb5;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }
        button:hover { background-color: #007e85; }
        .back-btn {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #aaa;
            text-decoration: none;
            font-size: 13px;
        }
    </style>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

    <div class="form-card">
        <h2>🚀 رفع لعبة جديدة</h2>
        <form id="upload-form">
            <div class="input-group">
                <label>اسم اللعبة:</label>
                <input type="text" id="game-name" placeholder="أدخل اسم اللعبة" required>
            </div>
            <div class="input-group">
                <label>رابط اللعبة (MediaFire):</label>
                <input type="url" id="game-link" placeholder="https://www.mediafire.com/file/..." required>
            </div>
            <div class="input-group">
                <label>رابط صور/أيقونة اللعبة (URL):</label>
                <input type="url" id="game-icon" placeholder="https://..." required>
            </div>
            <div class="input-group">
                <label>رقم الإصدار:</label>
                <input type="text" id="game-version" placeholder="مثال: 1.0.0" value="1.0.0" required>
            </div>
            <button type="submit" id="submit-btn">إرسال للمراجعة</button>
        </form>
        <a href="store.html" class="back-btn">إلغاء والعودة للمتجر</a>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAIU9w0_A9ba4agXyFIqAFZ_YpWV06sQGo",
            authDomain: "voxy-store.firebaseapp.com",
            projectId: "voxy-store",
            storageBucket: "voxy-store.firebasestorage.app",
            messagingSenderId: "21920174610",
            appId: "1:21920174610:web:29eeff5eda3aa5e4d6becb"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        document.getElementById('upload-form').addEventListener('submit', async function(e) {
            e.preventDefault();

            const username = localStorage.getItem('voxy_username');
            if (!username) {
                alert('يرجى تسجيل الدخول أولاً!');
                window.location.href = 'index.html';
                return;
            }

            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.textContent = 'جاري الإرسال...';

            const gameData = {
                name: document.getElementById('game-name').value.trim(),
                link: document.getElementById('game-link').value.trim(),
                icon: document.getElementById('game-icon').value.trim(),
                version: document.getElementById('game-version').value.trim(),
                uploader: username,
                createdAt: new Date().toISOString()
            };

            try {
                await db.collection('pending_games').add(gameData);
                alert('تم إرسال اللعبة بنجاح! سينظر فيها الأدمين قريباً.');
                window.location.href = 'store.html';
            } catch (err) {
                alert('حدث خطأ أثناء الإرسال: ' + err.message);
                btn.disabled = false;
                btn.textContent = 'إرسال للمراجعة';
            }
        });
    </script>
</body>
</html>
